name: Deploy Vite site to GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate catalog, translations and actual demo loaders
        run: npm run validate:data

      - name: Lint source and external links
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Smoke test Vite configuration and Pages redirects
        run: npm run test:smoke

      - name: Test routes, embed protocol and invalid data
        run: npm test

      - name: Build project
        run: npm run build

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Test production routes and all 16 demos in browser
        run: npm run test:browser

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Test blog publishing and reading with isolated content
        run: npm run test:blog

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
